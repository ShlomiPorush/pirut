# Disposable stack used by scripts/verify.sh to prove the image runs against a real
# PostgreSQL service. It is never used for ordinary development or production.
name: pirut-verify

services:
  web:
    image: ${PIRUT_IMAGE:?PIRUT_IMAGE must be set}
    environment:
      PIRUT_HOST: 0.0.0.0
      PIRUT_PORT: 4610
      PIRUT_LOG_LEVEL: warn
      PIRUT_DATABASE_URL: postgres://pirut:pirut-verify@db:5432/pirut
      # Fixed, obviously fake, and used only by this disposable stack.
      PIRUT_AUTH_SECRET: verification-only-secret-not-used-anywhere-else
      PIRUT_PUBLIC_URL: http://localhost:${PIRUT_WEB_PORT:-4699}
    ports:
      - "127.0.0.1:${PIRUT_WEB_PORT:-4699}:4610"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4610/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: pirut
      POSTGRES_USER: pirut
      POSTGRES_PASSWORD: pirut-verify
    volumes:
      - ${PIRUT_DATA_DIR:?PIRUT_DATA_DIR must be set}/postgres:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pirut -d pirut"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

networks:
  internal:
    driver: bridge
