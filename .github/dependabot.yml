version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      # Routine updates arrive as one reviewable pull request. Majors match no group,
      # so Dependabot opens an individual pull request for each of them.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /config/docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    ignore:
      # The Node major is a recorded stack decision, not a routine update: it must move
      # together with engines.node in package.json. Node 26 also drops Corepack, which
      # the image relies on. Raise it deliberately, not through an automated pull request.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
